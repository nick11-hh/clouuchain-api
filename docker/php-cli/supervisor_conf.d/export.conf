[program:export]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/dsp_api/artisan queue:listen --queue=export --tries=3 --memory=1024 --timeout=240
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/dsp_api/storage/logs/export.log
