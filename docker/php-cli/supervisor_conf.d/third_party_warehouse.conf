[program:third-party-warehouse]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/dsp_api/artisan queue:listen --queue=third-party-warehouse --tries=4 --memory=1024 --timeout=240
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/dsp_api/storage/logs/third-party-warehouse.log
